openapi: 3.0.3
info:
  title: Ecommerce Backend API
  version: 1.0.0
  description: |
    OpenAPI document for the existing Laravel API routes in this project.
    This file documents only the paths currently defined in routes/api.php.
servers:
  - url: http://127.0.0.1:8000
    description: Local Laravel development server
paths:
  /api/v1/register:
    post:
      tags:
        - Auth
      summary: Register a new customer
      description: Create a new user account and return a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - password_confirmation
              properties:
                name:
                  type: string
                  example: Ahmed Ali
                email:
                  type: string
                  format: email
                  example: ahmed@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: password123
                password_confirmation:
                  type: string
                  format: password
                  example: password123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/login:
    post:
      tags:
        - Auth
      summary: Login and obtain JWT
      description: Authenticate using email and password and receive a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: ahmed@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/logout:
    post:
      tags:
        - Auth
      summary: Logout current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully.
                  errors:
                    type: object
                    nullable: true
                    example: {}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/user:
    get:
      tags:
        - User
      summary: Get authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/products:
    get:
      tags:
        - Products
      summary: List products
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Optional category filter
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
      responses:
        '200':
          description: Products list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Products
      summary: Create product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - category
              properties:
                name:
                  type: string
                  example: Laptop Pro
                description:
                  type: string
                  nullable: true
                  example: 14-inch business laptop
                price:
                  type: number
                  format: float
                  example: 1200.00
                image:
                  type: string
                  format: binary
                  nullable: true
                category:
                  type: string
                  example: Electronics
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/orders:
    get:
      tags:
        - Orders
      summary: List current user orders
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
      responses:
        '200':
          description: Orders list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Orders
      summary: Create order after inventory reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                    properties:
                      product_id:
                        type: integer
                        minimum: 1
                        example: 3
                      quantity:
                        type: integer
                        minimum: 1
                        example: 2
      responses:
        '201':
          description: Order created and inventory reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Inventory reservation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/orders/{order}:
    get:
      tags:
        - Orders
      summary: Get one order by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: order
          required: true
          schema:
            type: integer
          description: Order ID
      responses:
        '200':
          description: Order details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/notifications:
    get:
      tags:
        - Notifications
      summary: List current user notifications
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
      responses:
        '200':
          description: Notifications list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Mark one notification as read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Notification identifier
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/notifications/read-all:
    patch:
      tags:
        - Notifications
      summary: Mark all unread notifications as read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: All notifications marked as read successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/users:
    post:
      tags:
        - Admin Users
      summary: Create user from admin panel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - password_confirmation
                - role
              properties:
                name:
                  type: string
                  example: Admin User
                email:
                  type: string
                  format: email
                  example: admin2@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: password123
                password_confirmation:
                  type: string
                  format: password
                  example: password123
                role:
                  type: string
                  enum: [customer, admin]
                  example: admin
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/admin/products:
    post:
      tags:
        - Admin Products
      summary: Create product from admin panel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - category
              properties:
                name:
                  type: string
                  example: Gaming Laptop
                description:
                  type: string
                  nullable: true
                price:
                  type: number
                  format: float
                  example: 1800.00
                image:
                  type: string
                  format: binary
                  nullable: true
                category:
                  type: string
                  example: Electronics
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/admin/orders/{order}/status:
    patch:
      tags:
        - Admin Orders
      summary: Update order status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: order
          required: true
          schema:
            type: integer
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, processing, shipped, delivered, cancelled]
                  example: shipped
      responses:
        '200':
          description: Order status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Order status updated successfully.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 12
                      status:
                        type: string
                        example: shipped
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/admin/inventory/{productId}:
    get:
      tags:
        - Admin Inventory
      summary: Get stock for product
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
            minimum: 1
          description: Product ID
      responses:
        '200':
          description: Inventory stock returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/inventory/reserve:
    post:
      tags:
        - Admin Inventory
      summary: Reserve stock for order items
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_reference
                - items
              properties:
                order_reference:
                  type: string
                  example: ORDER-4d8b5a5d-247f-4c72-aafe-2c7d4e83d4c9
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                    properties:
                      product_id:
                        type: integer
                        minimum: 1
                        example: 3
                      quantity:
                        type: integer
                        minimum: 1
                        example: 2
      responses:
        '200':
          description: Reservation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Reservation successful.
                  reservation_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Stock reservation rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/inventory/release:
    post:
      tags:
        - Admin Inventory
      summary: Release a reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reservation_id
              properties:
                reservation_id:
                  type: string
                  format: uuid
                  example: 7b1d3b6e-1a2f-4f06-a68d-850a13b13d44
      responses:
        '200':
          description: Reservation released successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Reservation released successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/inventory/add:
    post:
      tags:
        - Admin Inventory
      summary: Add stock to a product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - quantity
              properties:
                product_id:
                  type: integer
                  minimum: 1
                  example: 3
                quantity:
                  type: integer
                  minimum: 1
                  example: 5
      responses:
        '200':
          description: Stock updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Stock added successfully.
                  data:
                    type: object
                    properties:
                      product_id:
                        type: integer
                        example: 3
                      available_quantity:
                        type: integer
                        example: 17
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token returned by the login endpoint.

  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
    Forbidden:
      description: User does not have permission to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    ServiceUnavailable:
      description: Upstream inventory service is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'

  schemas:
    GenericErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Request failed.
        errors:
          type: object
          nullable: true
          additionalProperties: true

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Validation failed.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Ahmed Ali
        email:
          type: string
          format: email
          example: ahmed@example.com
        role:
          type: string
          enum: [customer, admin]
          example: customer
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    AuthSuccess:
      type: object
      properties:
        message:
          type: string
          example: Login successful.
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Laptop Pro
        description:
          type: string
          nullable: true
          example: 14-inch business laptop
        price:
          type: number
          format: float
          example: 1200.00
        image:
          type: string
          nullable: true
          example: products/example.jpg
        category:
          type: string
          example: Electronics
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    ProductListResponse:
      type: object
      properties:
        message:
          type: string
          example: Products retrieved successfully.
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 3
            per_page:
              type: integer
              example: 10
            total:
              type: integer
              example: 25

    ProductCreateResponse:
      type: object
      properties:
        message:
          type: string
          example: Product created successfully.
        data:
          $ref: '#/components/schemas/Product'

    OrderItem:
      type: object
      properties:
        id:
          type: integer
          example: 5
        product_id:
          type: integer
          example: 3
        quantity:
          type: integer
          example: 2
        price:
          type: number
          format: float
          example: 1200.00
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 10
        user_id:
          type: integer
          example: 1
        total:
          type: number
          format: float
          example: 2400.00
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
          example: pending
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderListResponse:
      type: object
      properties:
        message:
          type: string
          example: Orders retrieved successfully.
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        meta:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 2
            per_page:
              type: integer
              example: 10
            total:
              type: integer
              example: 18

    OrderDetailResponse:
      type: object
      properties:
        message:
          type: string
          example: Order retrieved successfully.
        data:
          $ref: '#/components/schemas/Order'

    OrderCreateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Order created and inventory reserved successfully.
        data:
          $ref: '#/components/schemas/Order'
        reservation_id:
          type: string
          format: uuid
          example: 7b1d3b6e-1a2f-4f06-a68d-850a13b13d44

    Notification:
      type: object
      properties:
        id:
          type: string
          example: 29d6db63-9e8b-44d0-897b-0ef4fb5dc4c8
        type:
          type: string
          example: App\Notifications\OrderCreated
        data:
          type: object
          additionalProperties: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    NotificationListResponse:
      type: object
      properties:
        message:
          type: string
          example: Notifications retrieved successfully.
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 1
            per_page:
              type: integer
              example: 10
            total:
              type: integer
              example: 5

    NotificationReadResponse:
      type: object
      properties:
        message:
          type: string
          example: Notification marked as read successfully.
        data:
          $ref: '#/components/schemas/Notification'

    AdminUserCreateResponse:
      type: object
      properties:
        message:
          type: string
          example: User created successfully.
        data:
          type: object
          properties:
            id:
              type: integer
              example: 7
            name:
              type: string
              example: Admin User
            email:
              type: string
              format: email
              example: admin2@example.com
            role:
              type: string
              enum: [customer, admin]
              example: admin
